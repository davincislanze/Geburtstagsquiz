<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Geburtstagsabschluss 🎉</title>

    <style>
        body {
          margin: 0;
          overflow: hidden;
          background: black;
          font-family: Arial, sans-serif;
        }

        .galerie {
          width: 100vw;
          height: 100vh;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          grid-template-rows: repeat(2, 1fr);
          gap: 8px;
          box-sizing: border-box;
          padding: 70px 8px 8px 8px;
        }

        .galerie img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          background: #111;
          border-radius: 12px;
        }

        .text {
          position: fixed;
          top: 10px;
          width: 100%;
          text-align: center;
          color: white;
          font-size: 36px;
          font-weight: bold;
          text-shadow: 3px 3px 8px black;
          z-index: 10;
        }
    </style>
</head>

<body>

<div class="text">Alles Gute zum Geburtstag 🎉</div>

<div class="galerie">
    <img src="Bilder/Geburtstag_6.jpg">
    <img src="Bilder/Geburtstag_2.jpg">
    <img src="Bilder/Geburtstag_5.jpg">
    <img src="Bilder/Geburtstag_1.jpg">
    <img src="Bilder/Geburtstag_3.jpg">
    <img src="Bilder/Geburtstag_4.jpg">

</div>

</body>
</html>
